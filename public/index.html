<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Arena FPS</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="hud">
    <div class="meter"><span>HP</span><strong id="hp">100</strong></div>
    <div class="meter"><span>K / D</span><strong><b id="kills">0</b> / <b id="deaths">0</b></strong></div>
    <div class="meter"><span>PLAYERS</span><strong id="players">1</strong></div>
  </div>

  <div id="crosshair" aria-hidden="true"><i></i></div>
  <div id="damage-vignette"></div>
  <div id="feed"></div>
  <div id="leaderboard"></div>

  <main id="menu">
    <section class="card">
      <p class="eyebrow">Multiplayer web FPS</p>
      <h1>NEON ARENA</h1>
      <p class="desc">안정적인 서버 판정, 리스폰, 체력/킬스코어가 들어간 간단한 브라우저 FPS입니다.</p>
      <label>
        닉네임
        <input id="name" maxlength="18" placeholder="Player" autocomplete="off" />
      </label>
      <button id="play">클릭해서 시작</button>
      <p class="controls">WASD 이동 · SPACE 점프 · SHIFT 달리기 · 마우스 조준 · 좌클릭 사격 · ESC 메뉴</p>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
